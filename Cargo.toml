[package]
# Port of Gateways to Eternity 5.1.0 (Shadows-of-Fire/GatewaysToEternity, MIT).
# Minecraft Java 1.21.1 NeoForge; the port targets Horizon 26.3 at the pin in
# horizon-mod.toml. Clean-room Rust rewrite from the mod's behaviour (notes.md,
# FINDINGS.md); local-only until the maintainer approves publishing, publishable
# under MIT with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "gateways"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Gateways to Eternity for Horizon: the normal gateway's wave state machine"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build). Any other
# registry dependency must be pinned with `horizon-launcher native-lock .` first.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
